name: streak

on:
  # OpenClaw or manual dispatch (see openclaw/ in README).
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note to add to today's log entry"
        required: false
        default: ""
      count:
        description: "Commits to make in this run (0 = top up to daily target of 6000)"
        required: false
        default: "0"
      force:
        description: "Ignore the daily cap and force the requested commit count"
        type: boolean
        required: false
        default: false
  # 5 scheduled slots across the UTC day (off-peak minute :23 to reduce cron lag):
  # 02:23, 07:23, 12:23, 16:23 (1200 commits each = 4800), plus 20:23 (final 1200 / top-up to 6000).
  schedule:
    - cron: "23 2,7,12,16,20 * * *"

permissions:
  contents: write

concurrency:
  group: streak
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test & build
        run: |
          cargo test --quiet
          cargo build --release --quiet

      - name: Configure git author
        # The author email must belong to your account or the commits won't turn the graph green.
        run: |
          git config user.name "Kolgrim33"
          git config user.email "252664188+Kolgrim33@users.noreply.github.com"

      - name: Write log, commit, and push in batches
        env:
          STREAK_NOTE: ${{ github.event.inputs.note }}
          INPUT_COUNT: ${{ github.event.inputs.count }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$((10#$(date -u +%H)))
            if [ "$HOUR" -ge 19 ]; then
              # Final scheduled run of the day: complete the last 1200 and top up any missed commits to 6000
              COUNT=6000
            else
              # 1200 commits per earlier scheduled slot (5 runs x 1200 = 6000)
              COUNT=1200
            fi
          else
            if [ "$INPUT_FORCE" = "true" ]; then
              FORCE_FLAG="--force"
            fi
            if [ -n "$INPUT_COUNT" ] && [ "$INPUT_COUNT" -gt 0 ] 2>/dev/null; then
              COUNT="$INPUT_COUNT"
            else
              COUNT=6000
            fi
          fi

          BATCH=200
          REMAINING="$COUNT"
          while [ "$REMAINING" -gt 0 ]; do
            STEP=$(( REMAINING < BATCH ? REMAINING : BATCH ))
            BEFORE=$(git rev-parse HEAD)
            ./target/release/streak $FORCE_FLAG --count "$STEP"
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" = "$AFTER" ]; then
              break
            fi
            git pull --rebase origin main
            git push origin HEAD:main
            STREAK_NOTE=""
            REMAINING=$(( REMAINING - STEP ))
            if [ "$REMAINING" -gt 0 ]; then
              sleep 1
            fi
          done
