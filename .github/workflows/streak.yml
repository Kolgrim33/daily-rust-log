name: streak

on:
  # OpenClaw or manual dispatch (see openclaw/ in README).
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note to add to today's log entry"
        required: false
        default: ""
      count:
        description: "Commits to make in this run (0 = top up to daily target of 500)"
        required: false
        default: "0"
  # 6 scheduled slots across the UTC day (off-peak minute :23 to reduce cron lag):
  # 01:23, 05:23, 09:23, 13:23, 17:23 (100 commits each = 500), plus 20:23 safety top-up.
  schedule:
    - cron: "23 1,5,9,13,17,20 * * *"

permissions:
  contents: write

concurrency:
  group: streak
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test & build
        run: |
          cargo test --quiet
          cargo build --release --quiet

      - name: Configure git author
        # The author email must belong to your account or the commits won't turn the graph green.
        run: |
          git config user.name "Kolgrim33"
          git config user.email "252664188+Kolgrim33@users.noreply.github.com"

      - name: Write log, commit, and push in batches
        env:
          STREAK_NOTE: ${{ github.event.inputs.note }}
          INPUT_COUNT: ${{ github.event.inputs.count }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$((10#$(date -u +%H)))
            if [ "$HOUR" -ge 19 ]; then
              # Final scheduled run of the day: top up any missed commits to 500
              COUNT=500
            else
              # 100 commits per earlier scheduled slot (5 slots x 100 = 500)
              COUNT=100
            fi
          else
            if [ -n "$INPUT_COUNT" ] && [ "$INPUT_COUNT" -gt 0 ] 2>/dev/null; then
              COUNT="$INPUT_COUNT"
            else
              COUNT=500
            fi
          fi

          BATCH=100
          REMAINING="$COUNT"
          while [ "$REMAINING" -gt 0 ]; do
            STEP=$(( REMAINING < BATCH ? REMAINING : BATCH ))
            BEFORE=$(git rev-parse HEAD)
            ./target/release/streak --count "$STEP"
            AFTER=$(git rev-parse HEAD)
            if [ "$BEFORE" = "$AFTER" ]; then
              break
            fi
            git pull --rebase origin main
            git push origin HEAD:main
            STREAK_NOTE=""
            REMAINING=$(( REMAINING - STEP ))
          done
