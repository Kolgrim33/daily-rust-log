name: streak

on:
  # OpenClaw triggers this daily from your machine (see openclaw/ in README).
  workflow_dispatch:
    inputs:
      note:
        description: "Optional note to add to today's log entry"
        required: false
        default: ""
  # Scheduled runs across the day in the cloud (runs even when PC is offline):
  # 06:15, 10:15, 14:15, 18:15, 21:15 UTC
  schedule:
    - cron: "15 6,10,14,18,21 * * *"

permissions:
  contents: write

concurrency:
  group: streak
  cancel-in-progress: false

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --quiet

      - name: Configure git author
        # The author email must belong to your account or the commits won't turn the graph green.
        run: |
          git config user.name "Kolgrim33"
          git config user.email "252664188+Kolgrim33@users.noreply.github.com"

      - name: Write log and commit
        env:
          STREAK_NOTE: ${{ github.event.inputs.note }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            HOUR=$(date -u +%H)
            if [ "$HOUR" -ge 21 ]; then
              # Final scheduled run of the day: top up to the daily target (15-20)
              COUNT=20
            else
              # 3 or 4 commits per earlier scheduled slot
              COUNT=$(( (RANDOM % 2) + 3 ))
            fi
          else
            COUNT=1
          fi
          cargo run --release --quiet -- --count "$COUNT"

      - name: Push
        run: |
          git pull --rebase origin main
          git push origin HEAD:main
